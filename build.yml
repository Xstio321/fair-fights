name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:          # manueller Trigger per Knopf auf GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 mss numpy pyinstaller

      - name: EXE bauen
        run: pyinstaller region_mirror.spec

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: RegionMirror-Windows
          path: dist/RegionMirror.exe
          retention-days: 30
